services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tourist
      POSTGRES_PASSWORD: tourist
      POSTGRES_DB: tourist
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourist"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourist:tourist@db:5432/tourist
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["models:/srv/backend/.models"]
volumes:
  pgdata:
  models:
